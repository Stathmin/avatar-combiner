[project]
name = "avatar-combiner"
version = "0.2.0"
description = "Объединение четырёх 96-луночных планшетов в один 384-луночный планшет"
readme = "README.md"
requires-python = ">=3.13"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
keywords = ["pcr", "plate", "384-well", "laboratory", "bio-rad"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
]
dependencies = [
    "biopython>=1.87,<2",
    "pint>=0.24.4,<1",
    "primer3-py>=2.3.1,<3",
    "seqfold>=0.10.2,<1",
    "pandas>=2.2,<4",
    "openpyxl>=3.1.5,<4",
    "wellmap==3.5.2",
    "pydna>=5.5.16,<6",
    "nicegui>=3.18.0,<4",
]

[project.urls]
Repository = "https://github.com/Stathmin/avatar-combiner"

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.5",
]
build = ["pyinstaller>=5.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
main_file = ""
addopts = "-p nicegui.testing.user_plugin"
markers = ["nicegui_main_file: main file for NiceGUI user-simulation tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
