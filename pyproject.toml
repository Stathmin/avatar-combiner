[project]
name = "avatar-combiner"
version = "0.2.0"
description = "Объединение четырёх 96-луночных планшетов в один 384-луночный планшет"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "biopython>=1.85",
    "pint>=0.24.4",
    "primer3-py>=2.3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
build = [
    "pyinstaller>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
